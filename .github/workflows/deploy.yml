name: Publicar no GitHub Pages

# O Pages deste repositório publica a partir da branch gh-pages.
# Este workflow espelha main em gh-pages a cada push, então basta
# commitar em main que o site é republicado.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publicar-pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Espelhar main na branch gh-pages
        run: git push origin HEAD:refs/heads/gh-pages --force
